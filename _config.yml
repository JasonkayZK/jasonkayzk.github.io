# Site settings
title: Jasonkay's blog
author: Jasonkay
email: jasonkayzk@gmail.com
description: >-
  Personal website of Jasonkay — Lecturer, software engineer and aspiring researcher.
affiliation: "Independent researcher, Aspiring Ph.D. Student"
hero_tagline: "> I turn curiosity into systems rooted in confidence, authenticity, reasonableness, and specificity."
hero_keywords: [Distributed System, AI Infra, HPC, English・日本語]
site_since: 2026
avatar: "/img/photo.png"

# Social links shown on the home hero (leave the value unset to hide the icon)
github_username: "JasonkayZK"
scholar_url: "https://scholar.google.com/citations?user=7vR3kJIAAAAJ"
twitter_username: "Jasonkay_ZK"

language: en
timezone: 'Asia/Shanghai'

# URL
url: https://jasonkayzk.github.io
permalink: blog/:year/:month/:day/:title/
pretty_urls:
  trailing_index: false

# Directory
source_dir: source
public_dir: public
new_post_name: :year-:month-:day-:title.md
default_layout: post

# Writing
meta_generator: false
external_link:
  enable: false

# Highlight
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: true
  wrap: true
  hljs: false

# Markdown (kramdown-parity behavior)
marked:
  breaks: false
  smartypants: false
  autolink: false
  mangle: false
  headerIds: true
  modifyAnchors: 1
  prependRoot: false
  lazyload: true
  figcaption: true

# Theme
theme: yohaku

# RSS
feed:
  type: atom
  path: feed.xml
  limit: 20
  content: true
  autodiscovery: true
