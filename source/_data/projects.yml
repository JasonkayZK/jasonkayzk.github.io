# Project cards. Fields:
#   name        — string
#   description — one short paragraph
#   tags        — list of tech tags
#   repo        — optional URL to the source repository
#   demo        — optional URL to a live demo

- name: high-performance-computing-learn
  description: >
    A hands-on learning repository exploring the fundamentals of high-performance computing (HPC), 
    from numerical analysis to parallel programming with CUDA, OpenMP, and MPI.
    It brings together practical examples and experiments to help developers understand 
    how to accelerate computations and make efficient use of modern hardware.
  tags: [HPC, notes]
  repo: https://github.com/JasonkayZK/high-performance-computing-learn
  demo: 

- name: translatorx
  description: >
    an open-source desktop app that turns everyday translation into active language learning.
    Instead of simply translating text, it helps users practice writing through interactive exercises, 
    word-by-word feedback, AI-powered tutoring, 
    and spaced repetition—all seamlessly integrated into their daily workflow.
  tags: [language-learning, translator, Tauri]
  repo: https://github.com/JasonkayZK/translatorx
  demo: https://jasonkayzk.github.io/translatorx/

- name: widgetx
  description: >
    A lightweight desktop application built with Tauri that lets users embed customizable web widgets directly on their desktop.
    It turns websites and web-based tools into convenient, always-accessible desktop widgets, 
    combining the flexibility of web technologies with the efficiency of a native application.
  tags: [desktop-tool, utility, Tauri]
  repo: https://github.com/JasonkayZK/widgetx
  demo: 

- name: mock-protobuf.js
  description: >
    A TypeScript-based CLI tool that automatically generates realistic mock JSON data and HTTP mock servers from Protocol Buffer definitions.
    It simplifies API development and testing by eliminating manual mock data creation, 
    with support for customizable responses, regex-based filtering, and Protobuf HTTP annotations.
  tags: [CLI, mock-tool, ]
  repo: https://github.com/JasonkayZK/mock-protobuf.js
  demo: 
