- title: "Application of Improved LSTM Neural Network in Motor Fault Diagnosis"
  year: 2021
  authors:
    - K. Zhang
    - G. Lin
    - Q. Luo
  venue: "Computer Measurement & Control"
  award: 
  tags: [LSTM, Deep Learning, Motor Fault Diagnosis]
  pdf: http://60.29.199.67:18081/KCMS/detail/detail.aspx?filename=JZCK202104010&dbcode=CJFQ&dbname=CJFDLAST2021
  links:
    - label: CNKI
      url: http://60.29.199.67:18081/KCMS/detail/detail.aspx?filename=JZCK202104010&dbcode=CJFQ&dbname=CJFDLAST2021
    - label: Code
      url: https://github.com/JasonkayZK/predictor
  abstract: >
    This paper proposes an improved LSTM-based method for asynchronous motor fault diagnosis using the RAdam optimizer.
    It combines double-peak spectral interpolation and sliding window techniques for harmonic extraction and time-series prediction, 
    enabling more accurate fault detection. 
    Experimental results using real-world motor data demonstrate improved fault detection performance compared to traditional neural networks.
